hostname DANANG-LOG-RTR01
ipv6 unicast-routing
!
interface GigabitEthernet0/1
 description 802.1Q trunk (Router-on-a-Stick) -> DANANG-LOG-SW01 Gi0/1
 no ip address
 no shutdown
!
interface GigabitEthernet0/1.30
 description LOGISTICS_OPS gateway (VLAN 30)
 encapsulation dot1Q 30
 ip address 10.30.30.1 255.255.255.0
 ipv6 address 2001:DB8:30:30::1/64
 ip helper-address 10.10.10.50
!
interface GigabitEthernet0/1.99
 description MANAGEMENT gateway (VLAN 99)
 encapsulation dot1Q 99
 ip address 192.168.3.1 255.255.255.0
 ipv6 address 2001:DB8:30:99::1/64
!
end
