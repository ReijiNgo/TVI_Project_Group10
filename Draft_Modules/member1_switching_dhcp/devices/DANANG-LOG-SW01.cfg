hostname DANANG-LOG-SW01
no ip domain-lookup
ip domain-name tvi.lab
username admin privilege 15 secret Cisco123!
ip ssh version 2
line con 0
 logging synchronous
line vty 0 4
 transport input ssh
 login local
!
vtp mode transparent
vlan 10
 name EXEC_FINANCE
vlan 20
 name RND_ENGINEERING
vlan 30
 name LOGISTICS_OPS
vlan 50
 name GUEST_WIFI
vlan 99
 name MANAGEMENT
vlan 999
 name BLACKHOLE
!
spanning-tree mode rapid-pvst
spanning-tree vlan 30,99 root primary
!
interface GigabitEthernet0/1
 description 802.1Q Trunk -> DANANG-LOG-RTR01 Gi0/1
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 30,99
 no shutdown
!
interface range FastEthernet0/1 - 20
 description LOGISTICS_OPS - IoT / Warehouse (VLAN 30)
 switchport mode access
 switchport access vlan 30
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
interface range FastEthernet0/21 - 24 , GigabitEthernet0/2
 description UNUSED - BLACKHOLE VLAN 999
 switchport mode access
 switchport access vlan 999
 shutdown
!
interface Vlan99
 description MANAGEMENT - Netmiko/SSHv2 target
 ip address 192.168.3.10 255.255.255.0
 ipv6 address 2001:DB8:30:99::10/64
 no shutdown
ip default-gateway 192.168.3.1
!
end
