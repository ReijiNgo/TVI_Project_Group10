hostname HCMC-CORE-SW01
no ip domain-lookup
ip domain-name tvi.lab
username admin privilege 15 secret Cisco123!
ip ssh version 2
line con 0
 logging synchronous
line vty 0 4
 transport input ssh
 login local
!
vtp mode transparent
vlan 10
 name EXEC_FINANCE
vlan 20
 name RND_ENGINEERING
vlan 30
 name LOGISTICS_OPS
vlan 50
 name GUEST_WIFI
vlan 99
 name MANAGEMENT
vlan 999
 name BLACKHOLE
!
spanning-tree mode rapid-pvst
!
interface GigabitEthernet0/1
 description 802.1Q Trunk -> HCMC-DIST-SW01 Gi0/4
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,99
 no shutdown
interface GigabitEthernet0/2
 description 802.1Q Trunk -> HCMC-DIST-SW02 Gi0/4 (STP Alternate)
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,99
 no shutdown
!
interface FastEthernet0/1
 description DHCP/DNS/NTP SERVER 10.10.10.50 (EXEC_FINANCE VLAN 10)
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
interface range FastEthernet0/2 - 10
 description EXEC_FINANCE PC (VLAN 10)
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
interface range FastEthernet0/11 - 20
 description RND_ENGINEERING PC (VLAN 20)
 switchport mode access
 switchport access vlan 20
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
interface FastEthernet0/24
 description MANAGEMENT - Automation Node (VLAN 99)
 switchport mode access
 switchport access vlan 99
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
interface range FastEthernet0/21 - 23
 description UNUSED - BLACKHOLE VLAN 999
 switchport mode access
 switchport access vlan 999
 shutdown
!
interface Vlan99
 description MANAGEMENT - Netmiko/SSHv2 target
 ip address 192.168.1.10 255.255.255.0
 ipv6 address 2001:DB8:10:99::10/64
 no shutdown
ip default-gateway 192.168.1.1
!
end
