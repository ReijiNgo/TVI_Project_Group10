! 1. HCMC-DIST-SW01 (L3 Switch - HSRP Active Priority 110 & STP Root Primary)
!    - Gi0/2 & Gi0/3: Port-channel 1 (LACP mode active) <-> HCMC-DIST-SW02
!    - Gi0/4: 802.1Q Trunk <-> HCMC-CORE-SW01 (Gi0/1)
!    - SVI Vlan 10: 10.10.10.2/24 (VIP 10.10.10.1) | 2001:DB8:10:10::2/64
!    - SVI Vlan 20: 10.10.20.2/23 (VIP 10.10.20.1) | 2001:DB8:10:20::2/64 + ip helper-address 10.10.10.50
!    - SVI Vlan 99: 192.168.1.2/24 (VIP 192.168.1.1) | 2001:DB8:10:99::2/64
! ----------------------------------------------------------------------------
! [Thành viên 1 điền câu lệnh Cisco CLI cho HCMC-DIST-SW01 tại đây]


! ----------------------------------------------------------------------------
! 2. HCMC-DIST-SW02 (L3 Switch - HSRP Standby Priority 100 & STP Root Secondary)
!    - Gi0/2 & Gi0/3: Port-channel 1 (LACP mode active) <-> HCMC-DIST-SW01
!    - Gi0/4: 802.1Q Trunk <-> HCMC-CORE-SW01 (Gi0/2)
!    - SVI Vlan 10: 10.10.10.3/24 (VIP 10.10.10.1) | 2001:DB8:10:10::3/64
!    - SVI Vlan 20: 10.10.20.3/23 (VIP 10.10.20.1) | 2001:DB8:10:20::3/64 + ip helper-address 10.10.10.50
!    - SVI Vlan 99: 192.168.1.3/24 (VIP 192.168.1.1) | 2001:DB8:10:99::3/64
! ----------------------------------------------------------------------------
! [Thành viên 1 điền câu lệnh Cisco CLI cho HCMC-DIST-SW02 tại đây]


! ----------------------------------------------------------------------------
! 3. HCMC-CORE-SW01 (L2 Access Switch - HQ)
!    - Gi0/1: 802.1Q Trunk <-> HCMC-DIST-SW01 (Gi0/4)
!    - Gi0/2: 802.1Q Trunk <-> HCMC-DIST-SW02 (Gi0/4)
!    - Fa0/1 - Fa0/10: Access VLAN 10 (EXEC_FINANCE) + PortFast
!    - Fa0/11 - Fa0/20: Access VLAN 20 (RND_ENGINEERING) + PortFast
!    - Fa0/24: Access VLAN 99 (MANAGEMENT) + PortFast
!    - Các cổng thừa còn lại -> VLAN 999 (BLACKHOLE) + shutdown
!    - SVI Vlan 99: 192.168.1.10/24 | 2001:DB8:10:99::10/64 | ip default-gateway 192.168.1.1
! ----------------------------------------------------------------------------
! [Thành viên 1 điền câu lệnh Cisco CLI cho HCMC-CORE-SW01 tại đây]


! ----------------------------------------------------------------------------
! 4. HANOI-RND-SW01 & HANOI-RND-SW02 (L2 Switches - Hà Nội)
!    - SW01 Gi0/1: 802.1Q Trunk <-> HANOI-RND-RTR01 (Gi0/1)
!    - SW01 & SW02 Gi0/2 - Gi0/3: Port-channel 1 (LACP mode active)
!    - Fa0/1 - Fa0/15: Access VLAN 20 (RND_ENGINEERING) + PortFast
!    - Fa0/16 - Fa0/20: Access VLAN 50 (GUEST_WIFI) + PortFast
!    - Các cổng thừa -> VLAN 999 (BLACKHOLE) + shutdown
!    - SVI Vlan 99: SW01 = 192.168.2.10/24, SW02 = 192.168.2.11/24 | ip default-gateway 192.168.2.1
! ----------------------------------------------------------------------------
! [Thành viên 1 điền câu lệnh Cisco CLI cho HANOI-RND-SW01 & SW02 tại đây]


! ----------------------------------------------------------------------------
! 5. DANANG-LOG-SW01 (L2 Switch - Đà Nẵng)
!    - Gi0/1: 802.1Q Trunk <-> DANANG-LOG-RTR01 (Gi0/1)
!    - Fa0/1 - Fa0/20: Access VLAN 30 (LOGISTICS_OPS) + PortFast
!    - Các cổng thừa -> VLAN 999 (BLACKHOLE) + shutdown
!    - SVI Vlan 99: 192.168.3.10/24 | 2001:DB8:30:99::10/64 | ip default-gateway 192.168.3.1
! ----------------------------------------------------------------------------
! [Thành viên 1 điền câu lệnh Cisco CLI cho DANANG-LOG-SW01 tại đây]


