!
service dhcp
ip dhcp bootp ignore
!
ip dhcp relay information trust-all
!
ntp master 3
!
ip dns server
ip host server.tvi.lab 10.10.10.50
ip host ntp.tvi.lab 10.10.10.50
ip host hcmc-core-sw01.tvi.lab 192.168.1.10
ip host hanoi-rnd-sw01.tvi.lab 192.168.2.10
ip host danang-log-sw01.tvi.lab 192.168.3.10
!
ip dhcp excluded-address 10.10.10.1 10.10.10.60
ip dhcp excluded-address 10.10.20.1 10.10.20.20
ip dhcp excluded-address 10.20.20.1 10.20.20.20
ip dhcp excluded-address 10.20.50.1 10.20.50.10
ip dhcp excluded-address 10.30.30.1 10.30.30.20
!
ip dhcp pool HQ_VLAN10_EXEC_FINANCE
 network 10.10.10.0 255.255.255.0
 default-router 10.10.10.1
 dns-server 10.10.10.50 8.8.8.8
 domain-name tvi.lab
 option 42 ip 10.10.10.50
 lease 7
!
ip dhcp pool HQ_VLAN20_RND
 network 10.10.20.0 255.255.254.0
 default-router 10.10.20.1
 dns-server 10.10.10.50 8.8.8.8
 domain-name tvi.lab
 option 42 ip 10.10.10.50
 lease 7
!
ip dhcp pool HN_VLAN20_RND
 network 10.20.20.0 255.255.254.0
 default-router 10.20.20.1
 dns-server 10.10.10.50 8.8.8.8
 domain-name tvi.lab
 option 42 ip 10.10.10.50
 lease 7
!
ip dhcp pool HN_VLAN50_GUEST
 network 10.20.50.0 255.255.255.128
 default-router 10.20.50.1
 dns-server 8.8.8.8
 lease 0 2
!
ip dhcp pool DN_VLAN30_LOGISTICS
 network 10.30.30.0 255.255.255.0
 default-router 10.30.30.1
 dns-server 10.10.10.50 8.8.8.8
 domain-name tvi.lab
 option 42 ip 10.10.10.50
 lease 3
!
end
