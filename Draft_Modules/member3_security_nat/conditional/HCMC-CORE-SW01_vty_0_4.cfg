! TARGET: HCMC-CORE-SW01
! CONDITIONAL CONSOLE ONLY: choose exactly ONE range after show line verification.
! Requires local login tested, no conflicting AAA method list, keys already present,
! and TWO-WAY SSH reachability from approved controller 192.168.1.100.
! IPv6 SSH is intentionally closed until an authorized IPv6 admin source is assigned.
! Never applied by Step9. Existing accounts/enable secrets/RSA keys remain untouched.
ip access-list standard M3_MGMT_VTY
 10 permit host 192.168.1.100
 20 deny any
exit
ipv6 access-list M3_MGMT6_VTY
 deny ipv6 any any
exit
line vty 0 4
 login local
 transport input ssh
 exec-timeout 10 0
 access-class M3_MGMT_VTY in
 ipv6 access-class M3_MGMT6_VTY in
exit
