! TARGET: HANOI-RND-SW01
! Additive only. Verify real image parser, existing bindings and MAC counts first.
! Scope excludes Management VLAN99. No trunk, STP, LACP or access-membership changes.
ip domain-name tvi.lab
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
no ip http server
no service pad
service timestamps log datetime msec
!
ip dhcp snooping
ip dhcp snooping vlan 20,50
! No approved Option82 consumer; avoid inserting Option82 with giaddr=0 toward M1 relay.
no ip dhcp snooping information option
interface GigabitEthernet0/1
 ip dhcp snooping trust
exit
interface GigabitEthernet0/2
 ip dhcp snooping trust
exit
interface GigabitEthernet0/3
 ip dhcp snooping trust
exit
interface Port-channel1
 ip dhcp snooping trust
exit
interface GigabitEthernet0/1
 ip arp inspection trust
exit
interface GigabitEthernet0/2
 ip arp inspection trust
exit
interface GigabitEthernet0/3
 ip arp inspection trust
exit
interface Port-channel1
 ip arp inspection trust
exit
interface GigabitEthernet1/0
 no ip dhcp snooping trust
 ip dhcp snooping limit rate 15
 no ip arp inspection trust
 switchport port-security
 switchport port-security maximum 2
 switchport port-security mac-address sticky
 switchport port-security violation restrict
exit
interface GigabitEthernet1/1
 no ip dhcp snooping trust
 ip dhcp snooping limit rate 15
 no ip arp inspection trust
 switchport port-security
 switchport port-security maximum 2
 switchport port-security mac-address sticky
 switchport port-security violation restrict
exit
! AP fan-out unknown: no Port Security and no guessed AP rate limit.
interface GigabitEthernet1/2
 no ip dhcp snooping trust
exit
! DAI VLAN activation is deliberately separate; see conditional/ and pending data.
