! ==============================================================================
! TECHVIET INNOVATIONS (TVI) - INTEGRATED STARTUP CONFIGURATION
! Device      : HCMC-EDGE-RTR01 (TP.HCM HQ WAN Edge Router - BGP AS 65001)
! Platform    : Cisco vIOS-L3 (15.x)
! Integrated  : Member 2 (OSPF/eBGP/GRE/IPsec/QoS) + Member 3 (NAT/SSH Hardening)
! ==============================================================================
! IMPORTANT: Generate RSA keys once on console after initial boot:
!   crypto key generate rsa modulus 2048
!
version 15.9
service timestamps debug datetime msec
service timestamps log datetime msec
service password-encryption
!
hostname HCMC-EDGE-RTR01
!
no ip domain-lookup
ip domain-name tvi.lab
no ip http server
no ip http secure-server
no service pad
!
username admin privilege 15 secret Cisco123!
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
!
ipv6 unicast-routing
!
banner motd ^C Unauthorized access to TVI Corporate Infrastructure is prohibited. ^C
!
! --- Quality of Service (Step 8: LLQ VoIP/Video over GRE Tunnel) ---
class-map match-any TVI-VOICE
 match ip dscp ef
class-map match-any TVI-VIDEO
 match ip dscp af31
!
policy-map TVI-WAN-QOS
 class TVI-VOICE
  priority percent 30
 class TVI-VIDEO
  bandwidth percent 20
 class class-default
  fair-queue
!
! --- IKEv1 & IPsec VPN (Step 6: HQ <-> Hanoi & Da Nang) ---
crypto isakmp policy 10
 encr aes 256
 hash sha
 authentication pre-share
 group 14
 lifetime 86400
!
crypto isakmp key TVI-IPsec-Key2026! address 203.0.113.5
crypto isakmp key TVI-IPsec-Key2026! address 203.0.113.9
!
crypto ipsec transform-set TVI-GRE-TS esp-aes 256 esp-sha-hmac
 mode transport
!
ip access-list extended TVI-GRE-HN
 permit gre host 203.0.113.1 host 203.0.113.5
ip access-list extended TVI-GRE-DN
 permit gre host 203.0.113.1 host 203.0.113.9
!
crypto map TVI-GRE-CMAP 10 ipsec-isakmp
 set peer 203.0.113.5
 set transform-set TVI-GRE-TS
 match address TVI-GRE-HN
!
crypto map TVI-GRE-CMAP 20 ipsec-isakmp
 set peer 203.0.113.9
 set transform-set TVI-GRE-TS
 match address TVI-GRE-DN
!
! --- Interfaces ---
interface Loopback0
 description OSPF-ROUTER-ID-TEST-ENDPOINT
 ip address 10.255.255.1 255.255.255.255
 ipv6 address 2001:DB8:10:FFFF::1/128
 ipv6 ospf 10 area 0
!
interface Tunnel12
 description GRE-IPSEC-TO-HANOI-RND-RTR01
 ip address 172.16.12.1 255.255.255.252
 ipv6 address 2001:DB8:CAFE:12::1/64
 tunnel source GigabitEthernet0/0
 tunnel destination 203.0.113.5
 tunnel mode gre ip
 ip mtu 1400
 ip tcp adjust-mss 1360
 ip ospf network point-to-point
 ipv6 ospf 10 area 0
 service-policy output TVI-WAN-QOS
 no shutdown
!
interface Tunnel13
 description GRE-IPSEC-TO-DANANG-LOG-RTR01
 ip address 172.16.13.1 255.255.255.252
 ipv6 address 2001:DB8:CAFE:13::1/64
 tunnel source GigabitEthernet0/0
 tunnel destination 203.0.113.9
 tunnel mode gre ip
 ip mtu 1400
 ip tcp adjust-mss 1360
 ip ospf network point-to-point
 ipv6 ospf 10 area 0
 service-policy output TVI-WAN-QOS
 no shutdown
!
interface GigabitEthernet0/0
 description WAN-TO-ISP-CORE-RTR01-Gi0/0
 ip address 203.0.113.1 255.255.255.252
 ipv6 address 2001:DB8:FFFF:1::1/64
 ip nat outside
 crypto map TVI-GRE-CMAP
 no shutdown
!
interface GigabitEthernet0/1
 description P2P-OSPF-TO-HCMC-DIST-SW01-Gi0/1
 ip address 10.10.254.1 255.255.255.252
 ipv6 address 2001:DB8:10:2541::1/64
 ip nat inside
 ipv6 ospf 10 area 0
 no shutdown
!
interface GigabitEthernet0/2
 description P2P-OSPF-TO-HCMC-DIST-SW02-Gi0/1
 ip address 10.10.254.5 255.255.255.252
 ipv6 address 2001:DB8:10:2542::1/64
 ip nat inside
 ipv6 ospf 10 area 0
 no shutdown
!
! --- Underlay Routing (Step 5: OSPFv2 & OSPFv3 Area 0) ---
router ospf 1
 router-id 10.255.255.1
 passive-interface default
 no passive-interface GigabitEthernet0/1
 no passive-interface GigabitEthernet0/2
 no passive-interface Tunnel12
 no passive-interface Tunnel13
 network 10.10.254.0 0.0.0.3 area 0
 network 10.10.254.4 0.0.0.3 area 0
 network 10.255.255.1 0.0.0.0 area 0
 network 172.16.12.0 0.0.0.3 area 0
 network 172.16.13.0 0.0.0.3 area 0
 default-information originate always
!
ipv6 router ospf 10
 router-id 10.255.255.1
 passive-interface default
 no passive-interface GigabitEthernet0/1
 no passive-interface GigabitEthernet0/2
 no passive-interface Tunnel12
 no passive-interface Tunnel13
!
! --- Overlay WAN Routing (Step 6: eBGP AS 65001 <-> ISP AS 65000) ---
ip prefix-list TVI-WAN-ONLY seq 5 permit 203.0.113.0/24 le 30
ip prefix-list TVI-WAN-ONLY seq 10 permit 8.8.8.8/32
ipv6 prefix-list TVI-WAN6-ONLY seq 5 permit 2001:DB8:FFFF::/48 le 64
ipv6 prefix-list TVI-WAN6-ONLY seq 10 permit 2001:4860:4860::8888/128
!
router bgp 65001
 bgp log-neighbor-changes
 neighbor 203.0.113.2 remote-as 65000
 neighbor 203.0.113.2 prefix-list TVI-WAN-ONLY in
 neighbor 2001:DB8:FFFF:1::2 remote-as 65000
 address-family ipv6
  neighbor 2001:DB8:FFFF:1::2 activate
  neighbor 2001:DB8:FFFF:1::2 prefix-list TVI-WAN6-ONLY in
 exit-address-family
!
! --- Default Route to ISP Next-Hop ---
ip route 0.0.0.0 0.0.0.0 203.0.113.2
!
! --- Security & NAT Overload (Step 7) ---
ip access-list extended M3_NAT_INTERNET
 10 deny ip any 10.0.0.0 0.255.255.255
 20 deny ip any 172.16.0.0 0.15.255.255
 30 deny ip any 192.168.0.0 0.0.255.255
 40 deny ip any 203.0.113.0 0.0.0.255
 50 permit ip 10.10.10.0 0.0.0.255 any
 60 permit ip 10.10.20.0 0.0.1.255 any
 70 permit ip 192.168.1.0 0.0.0.255 any
!
ip nat inside source list M3_NAT_INTERNET interface GigabitEthernet0/0 overload
!
! --- Console & VTY Hardening ---
line con 0
 logging synchronous
line vty 0 4
 transport input ssh
 login local
!
end
