! ==============================================================================
! TECHVIET INNOVATIONS (TVI) - INTEGRATED STARTUP CONFIGURATION
! Device      : HCMC-DIST-SW02 (TP.HCM HQ L3 Distribution 2 - HSRP Standby/STP Sec)
! Platform    : Cisco vIOS-L2 (16-Port GigabitEthernet: Gi0/0-3..Gi3/0-3)
! Integrated  : Member 1 (VLAN/LACP/HSRP) + Member 2 (OSPFv2/v3) + Member 3 (Hardening)
! ==============================================================================
! IMPORTANT: Generate RSA keys once on console after initial boot:
!   crypto key generate rsa modulus 2048
!
version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
service password-encryption
!
hostname HCMC-DIST-SW02
!
no ip domain-lookup
ip domain-name tvi.lab
no ip http server
no ip http secure-server
no service pad
!
username admin privilege 15 secret Cisco123!
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
!
ip routing
ipv6 unicast-routing
!
banner motd ^C Unauthorized access to TVI Corporate Infrastructure is prohibited. ^C
!
! --- VLAN Database ---
vtp mode transparent
vlan 10
 name EXEC_FINANCE
vlan 20
 name RND_ENGINEERING
vlan 30
 name LOGISTICS_OPS
vlan 50
 name GUEST_WIFI
vlan 99
 name MANAGEMENT
vlan 999
 name BLACKHOLE
!
! --- Spanning-Tree Secondary Root Bridge ---
spanning-tree mode rapid-pvst
spanning-tree vlan 10,20,99 root secondary
!
! --- Uplink Track ---
track 1 interface GigabitEthernet0/1 line-protocol
!
! --- Interfaces (16-Port Mapping) ---
interface Loopback0
 description OSPF-ROUTER-ID
 ip address 10.255.255.12 255.255.255.255
 ipv6 address 2001:DB8:10:FFFF::12/128
 ipv6 ospf 10 area 0
!
interface GigabitEthernet0/1
 description ROUTED-LINK-TO-HCMC-EDGE-RTR01-Gi0/2
 no switchport
 ip address 10.10.254.6 255.255.255.252
 ipv6 address 2001:DB8:10:2542::2/64
 ipv6 ospf 10 area 0
 no shutdown
!
interface range GigabitEthernet0/2 - 3
 description LACP Po1 <-> HCMC-DIST-SW01 Gi0/2-3
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,99
 channel-group 1 mode active
 no shutdown
!
interface Port-channel1
 description LACP Po1 <-> HCMC-DIST-SW01 Gi0/2-3
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,99
 no shutdown
!
interface GigabitEthernet1/0
 description 802.1Q Trunk -> HCMC-CORE-SW01 Gi0/2
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,99
 no shutdown
!
interface range GigabitEthernet0/0 , GigabitEthernet1/1 - 3 , GigabitEthernet2/0 - 3 , GigabitEthernet3/0 - 3
 description UNUSED - BLACKHOLE VLAN 999
 switchport mode access
 switchport access vlan 999
 shutdown
!
! --- Switched Virtual Interfaces (HSRP v2 Standby + OSPFv3) ---
interface Vlan10
 description EXEC_FINANCE gateway (HSRP group 10 Standby)
 ip address 10.10.10.3 255.255.255.0
 ipv6 address 2001:DB8:10:10::3/64
 ipv6 ospf 10 area 0
 standby version 2
 standby 10 ip 10.10.10.1
 standby 10 ipv6 2001:DB8:10:10::1/64
 standby 10 priority 100
 standby 10 preempt
 standby 10 timers 1 3
 standby 10 track 1 decrement 20
 no shutdown
!
interface Vlan20
 description RND_ENGINEERING gateway (HSRP group 20 Standby)
 ip address 10.10.20.3 255.255.254.0
 ipv6 address 2001:DB8:10:20::3/64
 ip helper-address 10.10.10.50
 ipv6 ospf 10 area 0
 standby version 2
 standby 20 ip 10.10.20.1
 standby 20 ipv6 2001:DB8:10:20::1/64
 standby 20 priority 100
 standby 20 preempt
 standby 20 timers 1 3
 standby 20 track 1 decrement 20
 no shutdown
!
interface Vlan99
 description MANAGEMENT gateway (HSRP group 99 Standby)
 ip address 192.168.1.3 255.255.255.0
 ipv6 address 2001:DB8:10:99::3/64
 ipv6 ospf 10 area 0
 standby version 2
 standby 99 ip 192.168.1.1
 standby 99 ipv6 2001:DB8:10:99::1/64
 standby 99 priority 100
 standby 99 preempt
 standby 99 timers 1 3
 standby 99 track 1 decrement 20
 no shutdown
!
! --- Underlay Routing (Step 5: OSPFv2 & OSPFv3 Area 0) ---
router ospf 1
 router-id 10.255.255.12
 passive-interface default
 no passive-interface GigabitEthernet0/1
 network 10.10.254.4 0.0.0.3 area 0
 network 10.255.255.12 0.0.0.0 area 0
 network 10.10.10.0 0.0.0.255 area 0
 network 10.10.20.0 0.0.1.255 area 0
 network 192.168.1.0 0.0.0.255 area 0
!
ipv6 router ospf 10
 router-id 10.255.255.12
 passive-interface default
 no passive-interface GigabitEthernet0/1
!
! --- Console & VTY Hardening ---
line con 0
 logging synchronous
line vty 0 4
 transport input ssh
 login local
!
end
