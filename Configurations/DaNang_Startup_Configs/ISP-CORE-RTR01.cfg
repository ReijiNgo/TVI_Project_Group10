! ==============================================================================
! TECHVIET INNOVATIONS (TVI) - INTEGRATED STARTUP CONFIGURATION
! Device      : ISP-CORE-RTR01 (Simulated ISP WAN PE Router - BGP AS 65000)
! Platform    : Cisco vIOS-L3 (15.x)
! Integrated  : Member 2 (00_base + 10_ebgp)
! ==============================================================================
! IMPORTANT: Generate RSA keys once on console after initial boot:
!   crypto key generate rsa modulus 2048
!
version 15.9
service timestamps debug datetime msec
service timestamps log datetime msec
service password-encryption
!
hostname ISP-CORE-RTR01
!
no ip domain-lookup
ip domain-name tvi.lab
no ip http server
no ip http secure-server
no service pad
!
username admin privilege 15 secret Cisco123!
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
!
ipv6 unicast-routing
!
banner motd ^C ISP-CORE-RTR01 (Simulated WAN Provider AS 65000) ^C
!
! --- Simulated Public Internet / DNS Target (8.8.8.8) ---
interface Loopback0
 description SYNTHETIC-INTERNET-TEST-ONLY
 ip address 8.8.8.8 255.255.255.255
 ipv6 address 2001:4860:4860::8888/128
!
! --- WAN Links to TVI Sites ---
interface GigabitEthernet0/0
 description TO-HCMC-EDGE-RTR01-Gi0/0
 ip address 203.0.113.2 255.255.255.252
 ipv6 address 2001:DB8:FFFF:1::2/64
 no shutdown
!
interface GigabitEthernet0/1
 description TO-HANOI-RND-RTR01-Gi0/0
 ip address 203.0.113.6 255.255.255.252
 ipv6 address 2001:DB8:FFFF:2::2/64
 no shutdown
!
interface GigabitEthernet0/2
 description TO-DANANG-LOG-RTR01-Gi0/0
 ip address 203.0.113.10 255.255.255.252
 ipv6 address 2001:DB8:FFFF:3::2/64
 no shutdown
!
! --- eBGP Provider Peering (AS 65000 <-> AS 65001, 65002, 65003) ---
ip prefix-list TVI-ISP-OUT seq 5 permit 203.0.113.0/24 le 30
ip prefix-list TVI-ISP-OUT seq 10 permit 8.8.8.8/32
ipv6 prefix-list TVI-ISP6-OUT seq 5 permit 2001:DB8:FFFF::/48 le 64
ipv6 prefix-list TVI-ISP6-OUT seq 10 permit 2001:4860:4860::8888/128
!
router bgp 65000
 bgp log-neighbor-changes
 neighbor 203.0.113.1 remote-as 65001
 neighbor 203.0.113.5 remote-as 65002
 neighbor 203.0.113.9 remote-as 65003
 neighbor 203.0.113.1 prefix-list TVI-ISP-OUT out
 neighbor 203.0.113.5 prefix-list TVI-ISP-OUT out
 neighbor 203.0.113.9 prefix-list TVI-ISP-OUT out
 network 203.0.113.0 mask 255.255.255.252
 network 203.0.113.4 mask 255.255.255.252
 network 203.0.113.8 mask 255.255.255.252
 network 8.8.8.8 mask 255.255.255.255
 neighbor 2001:DB8:FFFF:1::1 remote-as 65001
 neighbor 2001:DB8:FFFF:2::1 remote-as 65002
 neighbor 2001:DB8:FFFF:3::1 remote-as 65003
 address-family ipv6
  neighbor 2001:DB8:FFFF:1::1 activate
  neighbor 2001:DB8:FFFF:2::1 activate
  neighbor 2001:DB8:FFFF:3::1 activate
  neighbor 2001:DB8:FFFF:1::1 prefix-list TVI-ISP6-OUT out
  neighbor 2001:DB8:FFFF:2::1 prefix-list TVI-ISP6-OUT out
  neighbor 2001:DB8:FFFF:3::1 prefix-list TVI-ISP6-OUT out
  network 2001:DB8:FFFF:1::/64
  network 2001:DB8:FFFF:2::/64
  network 2001:DB8:FFFF:3::/64
  network 2001:4860:4860::8888/128
 exit-address-family
!
! --- Console & VTY Hardening ---
line con 0
 logging synchronous
line vty 0 4
 transport input ssh
 login local
!
end
