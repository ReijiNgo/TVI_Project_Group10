! ==============================================================================
! TECHVIET INNOVATIONS (TVI) - INTEGRATED STARTUP CONFIGURATION
! Device      : HANOI-RND-SW02 (Hanoi R&D Access/Dist Switch 2 - STP Root Sec)
! Platform    : Cisco vIOS-L2 (16-Port GigabitEthernet: Gi0/0-3..Gi3/0-3)
! Integrated  : Member 1 (VLAN/Trunk/LACP/STP) + Member 3 (Snooping/DAI/PortSec)
! ==============================================================================
! IMPORTANT: Generate RSA keys once on console after initial boot:
!   crypto key generate rsa modulus 2048
!
version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
service password-encryption
!
hostname HANOI-RND-SW02
!
no ip domain-lookup
ip domain-name tvi.lab
no ip http server
no ip http secure-server
no service pad
!
username admin privilege 15 secret Cisco123!
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
!
banner motd ^C Unauthorized access to TVI Corporate Infrastructure is prohibited. ^C
!
! --- VLAN Database ---
vtp mode transparent
vlan 10
 name EXEC_FINANCE
vlan 20
 name RND_ENGINEERING
vlan 30
 name LOGISTICS_OPS
vlan 50
 name GUEST_WIFI
vlan 99
 name MANAGEMENT
vlan 999
 name BLACKHOLE
!
! --- Spanning-Tree Secondary Root Bridge ---
spanning-tree mode rapid-pvst
spanning-tree vlan 20,50,99 root secondary
!
! --- Layer 2 Security (Step 7: DHCP Snooping + Dynamic ARP Inspection) ---
ip dhcp snooping
ip dhcp snooping vlan 20,50
no ip dhcp snooping information option
ip arp inspection vlan 20
!
! --- Interfaces (16-Port Mapping) ---
interface range GigabitEthernet0/2 - 3
 description LACP Po1 <-> HANOI-RND-SW01 Gi0/2-3
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 20,50,99
 channel-group 1 mode active
 ip dhcp snooping trust
 ip arp inspection trust
 no shutdown
!
interface Port-channel1
 description LACP Po1 <-> HANOI-RND-SW01 Gi0/2-3
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 20,50,99
 ip dhcp snooping trust
 ip arp inspection trust
 no shutdown
!
interface GigabitEthernet1/0
 description RND_ENGINEERING - AI Lab PC (VLAN 20)
 switchport mode access
 switchport access vlan 20
 spanning-tree portfast
 spanning-tree bpduguard enable
 no ip dhcp snooping trust
 ip dhcp snooping limit rate 15
 no ip arp inspection trust
 switchport port-security
 switchport port-security maximum 2
 switchport port-security mac-address sticky
 switchport port-security violation restrict
 no shutdown
!
interface GigabitEthernet1/1
 description RND_ENGINEERING - AI Lab PC (VLAN 20)
 switchport mode access
 switchport access vlan 20
 spanning-tree portfast
 spanning-tree bpduguard enable
 no ip dhcp snooping trust
 ip dhcp snooping limit rate 15
 no ip arp inspection trust
 switchport port-security
 switchport port-security maximum 2
 switchport port-security mac-address sticky
 switchport port-security violation restrict
 no shutdown
!
interface GigabitEthernet1/2
 description GUEST_WIFI - Access Point (VLAN 50)
 switchport mode access
 switchport access vlan 50
 spanning-tree portfast
 spanning-tree bpduguard enable
 no ip dhcp snooping trust
 no shutdown
!
interface range GigabitEthernet0/0 - 1 , GigabitEthernet1/3 , GigabitEthernet2/0 - 3 , GigabitEthernet3/0 - 3
 description UNUSED - BLACKHOLE VLAN 999
 switchport mode access
 switchport access vlan 999
 shutdown
!
! --- Management SVI & Default Gateway ---
interface Vlan99
 description MANAGEMENT - Netmiko/SSHv2 target
 ip address 192.168.2.11 255.255.255.0
 ipv6 address 2001:DB8:20:99::11/64
 no shutdown
!
ip default-gateway 192.168.2.1
!
! --- Console & VTY Hardening ---
line con 0
 logging synchronous
line vty 0 4
 transport input ssh
 login local
!
end
