! ==============================================================================
! TECHVIET INNOVATIONS (TVI) - INTEGRATED STARTUP CONFIGURATION
! Device      : HANOI-RND-RTR01 (Hanoi R&D Branch Router - BGP AS 65002)
! Platform    : Cisco vIOS-L3 (15.x)
! Integrated  : Member 1 (RoaS/Helper) + Member 2 (OSPF/eBGP/IPsec/QoS) + Member 3 (NAT/ACL/SSH)
! ==============================================================================
! IMPORTANT: Generate RSA keys once on console after initial boot:
!   crypto key generate rsa modulus 2048
!
version 15.9
service timestamps debug datetime msec
service timestamps log datetime msec
service password-encryption
!
hostname HANOI-RND-RTR01
!
no ip domain-lookup
ip domain-name tvi.lab
no ip http server
no ip http secure-server
no service pad
!
username admin privilege 15 secret Cisco123!
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
!
ipv6 unicast-routing
!
banner motd ^C Unauthorized access to TVI Corporate Infrastructure is prohibited. ^C
!
! --- Quality of Service (Step 8: LLQ VoIP/Video over GRE Tunnel) ---
class-map match-any TVI-VOICE
 match ip dscp ef
class-map match-any TVI-VIDEO
 match ip dscp af31
!
policy-map TVI-WAN-QOS
 class TVI-VOICE
  priority percent 30
 class TVI-VIDEO
  bandwidth percent 20
 class class-default
  fair-queue
!
! --- IKEv1 & IPsec VPN (Step 6: Hanoi <-> HQ) ---
crypto isakmp policy 10
 encr aes 256
 hash sha
 authentication pre-share
 group 14
 lifetime 86400
!
crypto isakmp key TVI-IPsec-Key2026! address 203.0.113.1
!
crypto ipsec transform-set TVI-GRE-TS esp-aes 256 esp-sha-hmac
 mode transport
!
ip access-list extended TVI-GRE-HQ
 permit gre host 203.0.113.5 host 203.0.113.1
!
crypto map TVI-GRE-CMAP 10 ipsec-isakmp
 set peer 203.0.113.1
 set transform-set TVI-GRE-TS
 match address TVI-GRE-HQ
!
! --- Interfaces ---
interface Loopback0
 description SITE-TEST-LOOPBACK
 ip address 10.255.255.2 255.255.255.255
 ipv6 address 2001:DB8:20:FFFF::2/128
 ipv6 ospf 10 area 0
!
interface Tunnel12
 description GRE-IPSEC-TO-HCMC-EDGE-RTR01
 ip address 172.16.12.2 255.255.255.252
 ipv6 address 2001:DB8:CAFE:12::2/64
 tunnel source GigabitEthernet0/0
 tunnel destination 203.0.113.1
 tunnel mode gre ip
 ip mtu 1400
 ip tcp adjust-mss 1360
 ip ospf network point-to-point
 ipv6 ospf 10 area 0
 service-policy output TVI-WAN-QOS
 no shutdown
!
interface GigabitEthernet0/0
 description WAN-TO-ISP-CORE-RTR01-Gi0/1
 ip address 203.0.113.5 255.255.255.252
 ipv6 address 2001:DB8:FFFF:2::1/64
 ip nat outside
 crypto map TVI-GRE-CMAP
 no shutdown
!
interface GigabitEthernet0/1
 description 802.1Q trunk (Router-on-a-Stick) -> HANOI-RND-SW01 Gi0/1
 no ip address
 no shutdown
!
interface GigabitEthernet0/1.20
 description RND_ENGINEERING gateway (VLAN 20)
 encapsulation dot1Q 20
 ip address 10.20.20.1 255.255.254.0
 ipv6 address 2001:DB8:20:20::1/64
 ip helper-address 10.10.10.50
 ip nat inside
 ipv6 ospf 10 area 0
!
interface GigabitEthernet0/1.50
 description GUEST_WIFI gateway (VLAN 50) - Isolated Guest ACL
 encapsulation dot1Q 50
 ip address 10.20.50.1 255.255.255.128
 ipv6 address 2001:DB8:20:50::1/64
 ip helper-address 10.10.10.50
 ip access-group M3_GUEST4_IN in
 ipv6 traffic-filter M3_GUEST6_IN in
 ip nat inside
 ipv6 ospf 10 area 0
!
interface GigabitEthernet0/1.99
 description MANAGEMENT gateway (VLAN 99)
 encapsulation dot1Q 99
 ip address 192.168.2.1 255.255.255.0
 ipv6 address 2001:DB8:20:99::1/64
 ip nat inside
 ipv6 ospf 10 area 0
!
! --- Underlay & Overlay Routing (Step 5: OSPFv2/v3 Area 0) ---
router ospf 1
 router-id 10.255.255.2
 passive-interface default
 no passive-interface Tunnel12
 network 172.16.12.0 0.0.0.3 area 0
 network 10.255.255.2 0.0.0.0 area 0
 network 10.20.20.0 0.0.1.255 area 0
 network 10.20.50.0 0.0.0.127 area 0
 network 192.168.2.0 0.0.0.255 area 0
!
ipv6 router ospf 10
 router-id 10.255.255.2
 passive-interface default
 no passive-interface Tunnel12
!
! --- WAN Routing (Step 6: eBGP AS 65002 <-> ISP AS 65000) ---
ip prefix-list TVI-WAN-ONLY seq 5 permit 203.0.113.0/24 le 30
ip prefix-list TVI-WAN-ONLY seq 10 permit 8.8.8.8/32
ipv6 prefix-list TVI-WAN6-ONLY seq 5 permit 2001:DB8:FFFF::/48 le 64
ipv6 prefix-list TVI-WAN6-ONLY seq 10 permit 2001:4860:4860::8888/128
!
router bgp 65002
 bgp log-neighbor-changes
 neighbor 203.0.113.6 remote-as 65000
 neighbor 203.0.113.6 prefix-list TVI-WAN-ONLY in
 neighbor 2001:DB8:FFFF:2::2 remote-as 65000
 address-family ipv6
  neighbor 2001:DB8:FFFF:2::2 activate
  neighbor 2001:DB8:FFFF:2::2 prefix-list TVI-WAN6-ONLY in
 exit-address-family
!
! --- Local Direct Internet Breakout Default Route ---
ip route 0.0.0.0 0.0.0.0 203.0.113.6
!
! --- Security: NAT Overload & Guest Wi-Fi Isolation ACLs (Step 7) ---
ip access-list extended M3_NAT_INTERNET
 10 deny ip any 10.0.0.0 0.255.255.255
 20 deny ip any 172.16.0.0 0.15.255.255
 30 deny ip any 192.168.0.0 0.0.255.255
 40 deny ip any 203.0.113.0 0.0.0.255
 50 permit ip 10.20.20.0 0.0.1.255 any
 60 permit ip 10.20.50.0 0.0.0.127 any
 70 permit ip 192.168.2.0 0.0.0.255 any
!
ip nat inside source list M3_NAT_INTERNET interface GigabitEthernet0/0 overload
!
ip access-list extended M3_GUEST4_IN
 10 permit udp host 0.0.0.0 eq bootpc host 255.255.255.255 eq bootps
 20 permit udp 10.20.50.0 0.0.0.127 eq bootpc host 255.255.255.255 eq bootps
 30 permit udp 10.20.50.0 0.0.0.127 eq bootpc host 10.10.10.50 eq bootps
 40 permit udp 10.20.50.0 0.0.0.127 eq bootpc host 10.20.50.1 eq bootps
 50 deny ip any 10.0.0.0 0.255.255.255
 60 deny ip any 172.16.0.0 0.15.255.255
 70 deny ip any 192.168.0.0 0.0.255.255
 80 deny ip any 203.0.113.0 0.0.0.255
 90 permit ip 10.20.50.0 0.0.0.127 any
 100 deny ip any any
!
ipv6 access-list M3_GUEST6_IN
 deny icmp any any router-advertisement
 deny icmp any any redirect
 permit icmp host :: host FF02::2 router-solicitation
 permit icmp FE80::/10 host FF02::2 router-solicitation
 permit icmp 2001:DB8:20:50::/64 host FF02::2 router-solicitation
 permit icmp host :: FF02::1:FF00:0/104 nd-ns
 permit icmp FE80::/10 FF02::1:FF00:0/104 nd-ns
 permit icmp 2001:DB8:20:50::/64 FF02::1:FF00:0/104 nd-ns
 permit icmp FE80::/10 FE80::/10 nd-ns
 permit icmp FE80::/10 2001:DB8:20:50::/64 nd-ns
 permit icmp 2001:DB8:20:50::/64 FE80::/10 nd-ns
 permit icmp 2001:DB8:20:50::/64 2001:DB8:20:50::/64 nd-ns
 permit icmp FE80::/10 FE80::/10 nd-na
 permit icmp FE80::/10 2001:DB8:20:50::/64 nd-na
 permit icmp 2001:DB8:20:50::/64 FE80::/10 nd-na
 permit icmp 2001:DB8:20:50::/64 2001:DB8:20:50::/64 nd-na
 permit icmp FE80::/10 host FF02::1 nd-na
 permit icmp 2001:DB8:20:50::/64 host FF02::1 nd-na
 deny ipv6 any 2001:DB8:10::/48
 deny ipv6 any 2001:DB8:20::/48
 deny ipv6 any 2001:DB8:30::/48
 deny ipv6 any 2001:DB8:CAFE::/48
 deny ipv6 any 2001:DB8:FFFF::/48
 deny ipv6 any FC00::/7
 deny ipv6 any FE80::/10
 deny ipv6 any FF00::/8
 permit ipv6 2001:DB8:20:50::/64 any
 deny ipv6 any any
!
! --- Console & VTY Hardening ---
line con 0
 logging synchronous
line vty 0 4
 transport input ssh
 login local
!
end
