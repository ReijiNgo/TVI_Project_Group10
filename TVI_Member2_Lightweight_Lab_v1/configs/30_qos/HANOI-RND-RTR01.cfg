! Commands intended for global configuration mode. Do not use as startup-config blindly.

! Experimental IOSv QoS candidate; not an assurance of strict priority under congestion.
class-map match-any TVI-VOICE
 match ip dscp ef
!
class-map match-any TVI-VIDEO
 match ip dscp af31
!
policy-map TVI-WAN-QOS
 class TVI-VOICE
  priority percent 30
 class TVI-VIDEO
  bandwidth percent 20
!
interface Tunnel12
 service-policy output TVI-WAN-QOS
!
